<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>時鐘小工具範例</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg:     #0d0f12;
            --bg2:    #13161b;
            --bg3:    #1a1e25;
            --border: #2a2f3a;
            --text:   #cdd5e0;
            --text2:  #7e8a9e;
            --accent: #3b82f6;
            --mono:   'JetBrains Mono', monospace;
            --sans:   'IBM Plex Sans', system-ui, sans-serif;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: var(--sans);
            background: var(--bg);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .clock-widget {
            background: var(--bg2);
            border: 1px solid var(--border);
            padding: 3rem;
            border-radius: 14px;
            text-align: center;
            max-width: 400px;
            width: 100%;
        }

        .clock-title {
            font-family: var(--mono);
            font-size: 10px;
            font-weight: 600;
            letter-spacing: .12em;
            text-transform: uppercase;
            color: var(--accent);
            margin-bottom: 1.5rem;
        }

        .clock-display {
            font-family: var(--mono);
            font-size: 3.5rem;
            font-weight: 600;
            color: var(--text);
            font-variant-numeric: tabular-nums;
            margin-bottom: 1.5rem;
            padding: 1rem 2rem;
            background: var(--bg3);
            border: 1px solid var(--border);
            border-radius: 10px;
            letter-spacing: .04em;
        }

        .clock-date {
            font-size: 0.9375rem;
            color: var(--text2);
            font-weight: 400;
            padding: 0.625rem 1.25rem;
            background: var(--bg3);
            border: 1px solid var(--border);
            border-radius: 8px;
            display: inline-block;
        }
    </style>
</head>
<body>
    <div class="clock-widget">
        <div class="clock-title">即時時鐘</div>
        <div class="clock-display" id="time">00:00:00</div>
        <div class="clock-date" id="date"></div>
    </div>

    <script>
        function updateClock() {
            const now = new Date();

            // 更新時間
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('time').textContent = `${hours}:${minutes}:${seconds}`;

            // 更新日期
            const options = { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' };
            document.getElementById('date').textContent = now.toLocaleDateString('zh-TW', options);
        }

        // 立即更新一次
        updateClock();

        // 每秒更新
        setInterval(updateClock, 1000);
    </script>
</body>
</html>
