<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>網頁檢查工具 — DNS · Meta · 社群分享預覽</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:#0d0f12; --bg2:#13161b; --bg3:#1a1e25; --bg4:#222730;
    --border:#2a2f3a; --border2:#333a47;
    --text:#cdd5e0; --text2:#7e8a9e; --text3:#4a5568;
    --accent:#22d3ee; --accent-bg:rgba(34,211,238,.10);
    --ok:#22c55e; --warn:#f59e0b; --err:#f87171;
    --radius:8px; --radius-sm:5px;
    --mono:'JetBrains Mono','Fira Code',monospace;
    --sans:'IBM Plex Sans',system-ui,sans-serif;
  }
  html, body { height:100%; background:var(--bg); color:var(--text); font-family:var(--sans); font-size:14px; line-height:1.5; }
  .layout { display:flex; flex-direction:column; height:100vh; overflow:hidden; }

  /* ── Header ── */
  .header { display:flex; align-items:center; gap:12px; padding:0 16px; height:48px; border-bottom:1px solid var(--border); background:var(--bg2); flex-shrink:0; }
  .back-btn { display:flex; align-items:center; gap:6px; font-size:12px; color:var(--text2); text-decoration:none; padding:5px 10px; border:1px solid var(--border); border-radius:var(--radius-sm); transition:all .15s; }
  .back-btn:hover { border-color:var(--accent); color:var(--accent); }
  .sep { color:var(--text3); font-size:11px; }
  .logo { display:flex; align-items:center; gap:8px; font-family:var(--mono); font-size:13px; font-weight:600; }
  .logo-icon { width:22px; height:22px; background:var(--accent); border-radius:5px; display:flex; align-items:center; justify-content:center; font-size:12px; color:#05242a; flex-shrink:0; }
  .spacer { flex:1; }
  .hbtn { font-size:12px; padding:5px 12px; border:1px solid var(--border2); border-radius:var(--radius-sm); background:transparent; color:var(--text2); cursor:pointer; transition:all .15s; }
  .hbtn:hover { border-color:var(--accent); color:var(--accent); }
  .hbtn.danger:hover { border-color:var(--err); color:var(--err); }

  /* ── Body ── */
  .body { flex:1; display:grid; grid-template-columns:380px 1fr; overflow:hidden; }
  .input-col { border-right:1px solid var(--border); background:var(--bg2); padding:18px; overflow-y:auto; display:flex; flex-direction:column; gap:16px; }
  .input-col::-webkit-scrollbar { width:5px; } .input-col::-webkit-scrollbar-thumb { background:var(--border2); border-radius:4px; }
  .field-label { font-size:10px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--text3); margin-bottom:8px; }
  .url-row { display:flex; gap:8px; }
  input.url { flex:1; font-family:var(--mono); font-size:13px; padding:9px 11px; background:var(--bg3); border:1px solid var(--border2); border-radius:var(--radius-sm); color:var(--text); outline:none; }
  input.url:focus { border-color:var(--accent); }
  .btn { font-family:var(--sans); font-size:12.5px; font-weight:500; padding:9px 14px; border-radius:var(--radius-sm); cursor:pointer; transition:all .15s; border:1px solid var(--border2); background:transparent; color:var(--text2); white-space:nowrap; }
  .btn:hover { border-color:var(--accent); color:var(--accent); }
  .btn-primary { background:var(--accent); border-color:var(--accent); color:#05242a; font-weight:600; }
  .btn-primary:hover { filter:brightness(1.08); color:#05242a; }
  .btn-block { width:100%; }
  textarea.html { width:100%; height:200px; resize:vertical; font-family:var(--mono); font-size:11.5px; line-height:1.6; padding:11px; background:var(--bg3); border:1px solid var(--border2); border-radius:var(--radius-sm); color:var(--text); outline:none; }
  textarea.html:focus { border-color:var(--accent); }
  textarea.html::placeholder { color:var(--text3); }
  .btn-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .cors-note { font-size:11px; color:var(--text3); line-height:1.7; padding:11px 12px; background:var(--bg3); border-left:2px solid var(--accent); border-radius:var(--radius-sm); }

  /* ── Results ── */
  .results { display:flex; flex-direction:column; overflow:hidden; background:var(--bg); }
  .tabs { display:flex; gap:2px; padding:0 16px; border-bottom:1px solid var(--border); background:var(--bg2); flex-shrink:0; }
  .tab { font-size:12.5px; padding:12px 14px; color:var(--text3); cursor:pointer; border-bottom:2px solid transparent; transition:all .15s; white-space:nowrap; }
  .tab:hover { color:var(--text2); }
  .tab.on { color:var(--accent); border-bottom-color:var(--accent); }
  .tab .badge { font-family:var(--mono); font-size:9px; background:var(--bg4); padding:1px 5px; border-radius:7px; margin-left:5px; color:var(--text3); }
  .panels { flex:1; overflow-y:auto; padding:22px; }
  .panels::-webkit-scrollbar { width:6px; } .panels::-webkit-scrollbar-thumb { background:var(--border2); border-radius:4px; }
  .panel { display:none; } .panel.on { display:block; }
  .empty { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; height:100%; color:var(--text3); text-align:center; }
  .empty-icon { font-size:34px; opacity:.4; }
  .empty p { font-family:var(--mono); font-size:12px; }

  /* DNS */
  .dns-block { margin-bottom:18px; }
  .dns-type { font-family:var(--mono); font-size:12px; font-weight:600; color:var(--accent); margin-bottom:6px; display:flex; align-items:center; gap:8px; }
  .dns-type .desc { font-family:var(--sans); font-weight:400; font-size:11px; color:var(--text3); }
  .dns-table { width:100%; border-collapse:collapse; font-family:var(--mono); font-size:12px; }
  .dns-table td { padding:7px 10px; border:1px solid var(--border); vertical-align:top; }
  .dns-table td.data { color:var(--text); word-break:break-all; } .dns-table td.ttl { color:var(--text3); width:80px; white-space:nowrap; }
  .dns-none { font-family:var(--mono); font-size:11px; color:var(--text3); padding:6px 0; }

  /* SEO */
  .seo-row { display:grid; grid-template-columns:140px 1fr; gap:12px; padding:11px 0; border-bottom:1px solid var(--border); }
  .seo-key { font-size:12px; color:var(--text3); display:flex; align-items:center; gap:6px; }
  .seo-val { font-size:13px; color:var(--text); word-break:break-word; }
  .seo-val.mono { font-family:var(--mono); font-size:12px; }
  .seo-val .muted { color:var(--text3); font-style:italic; }
  .chk { font-size:11px; font-family:var(--mono); padding:1px 6px; border-radius:4px; flex-shrink:0; }
  .chk.ok { color:var(--ok); background:rgba(34,197,94,.1); } .chk.warn { color:var(--warn); background:rgba(245,158,11,.1); } .chk.err { color:var(--err); background:rgba(248,113,113,.1); }

  /* Social previews */
  .prev-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:20px; }
  .prev-col h3 { font-size:11px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--text3); margin-bottom:12px; }
  .card-x { border:1px solid var(--border2); border-radius:14px; overflow:hidden; background:var(--bg2); max-width:440px; }
  .card-x .img { width:100%; aspect-ratio:1.91/1; background:var(--bg4); object-fit:cover; display:block; }
  .card-x .body { padding:11px 13px; }
  .card-x .dom { font-size:12px; color:var(--text3); }
  .card-x .title { font-size:14px; font-weight:600; color:var(--text); margin-top:2px; line-height:1.35; }
  .card-x .desc { font-size:12.5px; color:var(--text2); margin-top:3px; line-height:1.4; }
  .card-fb { border:1px solid var(--border2); border-radius:10px; overflow:hidden; background:var(--bg2); max-width:440px; }
  .card-fb .img { width:100%; aspect-ratio:1.91/1; background:var(--bg4); object-fit:cover; display:block; }
  .card-fb .body { padding:11px 13px; background:var(--bg3); }
  .card-fb .dom { font-size:11px; color:var(--text3); text-transform:uppercase; letter-spacing:.02em; }
  .card-fb .title { font-size:15px; font-weight:600; color:var(--text); margin-top:3px; line-height:1.3; }
  .card-fb .desc { font-size:12.5px; color:var(--text2); margin-top:3px; line-height:1.4; }
  .noimg { display:flex; align-items:center; justify-content:center; color:var(--text3); font-family:var(--mono); font-size:11px; }

  /* Raw tags */
  .raw-list { font-family:var(--mono); font-size:12px; }
  .raw-item { display:grid; grid-template-columns:minmax(120px,240px) 1fr; gap:14px; padding:7px 0; border-bottom:1px solid var(--border); }
  .raw-key { color:var(--accent); word-break:break-all; } .raw-val { color:var(--text2); word-break:break-all; }

  .status { flex-shrink:0; padding:7px 16px; font-family:var(--mono); font-size:11px; border-top:1px solid var(--border); background:var(--bg2); min-height:30px; color:var(--text3); }
  .status.err { color:var(--err); } .status.ok { color:var(--ok); }

  @media (max-width:820px){ .body{grid-template-columns:1fr; grid-template-rows:auto 1fr;} .input-col{border-right:none;border-bottom:1px solid var(--border);max-height:42vh;} }
</style>
</head>
<body>
<div class="layout">
  <header class="header">
    <a class="back-btn" href="../index.html">&#8592; 返回</a>
    <span class="sep">/</span>
    <div class="logo"><div class="logo-icon">🌐</div> 網頁檢查工具</div>
    <div class="spacer"></div>
    <button class="hbtn" id="btnSample">載入範例</button>
    <button class="hbtn danger" id="btnClear">清除</button>
  </header>

  <div class="body">
    <div class="input-col">
      <div>
        <div class="field-label">網址 / 網域</div>
        <div class="url-row">
          <input class="url" id="urlInput" type="text" placeholder="example.com 或 https://…" spellcheck="false">
          <button class="btn btn-primary" id="btnDns">查 DNS</button>
        </div>
      </div>
      <div>
        <div class="field-label">HTML 原始碼</div>
        <textarea class="html" id="htmlInput" spellcheck="false" placeholder="貼上目標網頁的 HTML 原始碼（在瀏覽器檢視原始碼 → 全選複製），即可解析 Meta 標籤與社群分享預覽。"></textarea>
        <div class="btn-grid" style="margin-top:8px">
          <button class="btn" id="btnFetch">嘗試直接抓取</button>
          <button class="btn btn-primary" id="btnParse">解析 HTML</button>
        </div>
      </div>
      <div class="cors-note">
        🔒 此工具完全在瀏覽器本地執行。<br>
        <b>DNS</b> 透過 DNS-over-HTTPS（Cloudflare / Google）查詢，可直接使用。<br>
        <b>Meta / 社群預覽</b> 因瀏覽器 CORS 限制，多數網站無法被前端直接抓取，建議貼上 HTML 原始碼解析。
      </div>
    </div>

    <div class="results">
      <div class="tabs">
        <div class="tab on" data-tab="dns">DNS 紀錄<span class="badge" id="bDns">0</span></div>
        <div class="tab" data-tab="seo">SEO / Meta<span class="badge" id="bSeo">0</span></div>
        <div class="tab" data-tab="social">社群預覽</div>
        <div class="tab" data-tab="raw">原始標籤<span class="badge" id="bRaw">0</span></div>
      </div>
      <div class="panels">
        <div class="panel on" id="pDns"><div class="empty"><div class="empty-icon">🔍</div><p>輸入網域後點「查 DNS」</p></div></div>
        <div class="panel" id="pSeo"><div class="empty"><div class="empty-icon">🏷</div><p>貼上 HTML 原始碼後點「解析 HTML」</p></div></div>
        <div class="panel" id="pSocial"><div class="empty"><div class="empty-icon">📣</div><p>解析 HTML 後在此預覽分享卡片</p></div></div>
        <div class="panel" id="pRaw"><div class="empty"><div class="empty-icon">{ }</div><p>解析 HTML 後在此列出所有標籤</p></div></div>
      </div>
      <div class="status" id="status">就緒</div>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function setStatus(t, type=''){ const s=$('status'); s.className='status '+type; s.textContent=t; }
function showTab(name){
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on', t.dataset.tab===name));
  document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('on', p.id==='p'+name.charAt(0).toUpperCase()+name.slice(1)));
}
document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => showTab(t.dataset.tab)));

// ── URL helpers ──
function normHost(input){
  let v = input.trim();
  if(!v) return '';
  if(!/^https?:\/\//i.test(v)) v = 'http://'+v;
  try { return new URL(v).hostname; } catch(e){ return input.trim().replace(/^https?:\/\//,'').split('/')[0]; }
}
function normUrl(input){
  let v=input.trim(); if(!v) return null;
  if(!/^https?:\/\//i.test(v)) v='https://'+v;
  try { return new URL(v); } catch(e){ return null; }
}

// ── DNS over HTTPS ──
const TYPE_NAME = {1:'A',2:'NS',5:'CNAME',6:'SOA',12:'PTR',15:'MX',16:'TXT',28:'AAAA',33:'SRV',257:'CAA'};
const QUERY_TYPES = [
  {t:'A', desc:'IPv4 位址'}, {t:'AAAA', desc:'IPv6 位址'}, {t:'CNAME', desc:'別名'},
  {t:'MX', desc:'郵件伺服器'}, {t:'NS', desc:'名稱伺服器'}, {t:'TXT', desc:'文字紀錄（SPF/驗證）'},
  {t:'SOA', desc:'授權起始'}, {t:'CAA', desc:'憑證授權'}
];
const DOH = [
  { name:'Cloudflare', url:(n,t)=>`https://cloudflare-dns.com/dns-query?name=${encodeURIComponent(n)}&type=${t}`, headers:{accept:'application/dns-json'} },
  { name:'Google',     url:(n,t)=>`https://dns.google/resolve?name=${encodeURIComponent(n)}&type=${t}`, headers:{} },
];
async function dohQuery(name, type){
  let lastErr;
  for(const p of DOH){
    try {
      const r = await fetch(p.url(name, type), { headers:p.headers });
      if(r.ok) return await r.json();
      lastErr = new Error('HTTP '+r.status);
    } catch(e){ lastErr=e; }
  }
  throw lastErr || new Error('查詢失敗');
}
async function runDns(){
  const host = normHost($('urlInput').value);
  if(!host){ setStatus('請先輸入網域', 'err'); return; }
  showTab('dns');
  $('pDns').innerHTML = `<div class="empty"><div class="empty-icon">⏳</div><p>查詢 ${esc(host)} …</p></div>`;
  setStatus('查詢 DNS：'+host);
  try {
    const results = await Promise.all(QUERY_TYPES.map(async q => {
      try { const json = await dohQuery(host, q.t); return { q, answers:(json.Answer||[]).filter(a => (TYPE_NAME[a.type]||'')===q.t) }; }
      catch(e){ return { q, answers:[], error:true }; }
    }));
    let total=0;
    const blocks = results.map(({q, answers, error}) => {
      total += answers.length;
      let inner;
      if(error) inner = `<div class="dns-none">查詢失敗</div>`;
      else if(!answers.length) inner = `<div class="dns-none">無紀錄</div>`;
      else inner = `<table class="dns-table">${answers.map(a =>
        `<tr><td class="data">${esc(a.data)}</td><td class="ttl">TTL ${a.TTL}</td></tr>`).join('')}</table>`;
      return `<div class="dns-block"><div class="dns-type">${q.t}<span class="desc">${q.desc}</span></div>${inner}</div>`;
    });
    $('pDns').innerHTML = blocks.join('');
    $('bDns').textContent = total;
    setStatus(`✓ DNS 查詢完成：${host} · 共 ${total} 筆紀錄`, 'ok');
  } catch(e){
    $('pDns').innerHTML = `<div class="empty"><div class="empty-icon">⚠</div><p>${esc(e.message||'查詢失敗')}</p></div>`;
    setStatus('✗ DNS 查詢失敗：'+(e.message||''), 'err');
  }
}

// ── HTML / Meta parsing ──
let parsedData = null;
function parseHtml(html){
  const baseUrl = normUrl($('urlInput').value);
  const doc = new DOMParser().parseFromString(html, 'text/html');
  const abs = u => { if(!u) return ''; try { return baseUrl ? new URL(u, baseUrl).href : u; } catch(e){ return u; } };

  const props = {};
  doc.querySelectorAll('meta').forEach(m => {
    const key = (m.getAttribute('property') || m.getAttribute('name') || m.getAttribute('itemprop') || '').trim().toLowerCase();
    const val = m.getAttribute('content');
    if(key && val!=null && !(key in props)) props[key] = val;
  });
  const charsetMeta = doc.querySelector('meta[charset]');
  const canonical = doc.querySelector('link[rel="canonical"]')?.getAttribute('href') || '';
  let favicon = doc.querySelector('link[rel~="icon"]')?.getAttribute('href') || '';
  const data = {
    title: doc.querySelector('title')?.textContent?.trim() || '',
    description: props['description'] || '',
    keywords: props['keywords'] || '',
    canonical: abs(canonical),
    robots: props['robots'] || '',
    viewport: props['viewport'] || '',
    charset: charsetMeta ? (charsetMeta.getAttribute('charset')||'') : (props['content-type']||''),
    lang: doc.documentElement.getAttribute('lang') || '',
    themeColor: props['theme-color'] || '',
    favicon: abs(favicon),
    h1: [...doc.querySelectorAll('h1')].map(h=>h.textContent.trim()).filter(Boolean),
    og: {}, twitter: {}, props,
  };
  for(const k in props){
    if(k.startsWith('og:') || k.startsWith('article:') || k.startsWith('product:')) data.og[k]=props[k];
    if(k.startsWith('twitter:')) data.twitter[k]=props[k];
  }
  data.og['og:image'] = abs(data.og['og:image']);
  data.twitter['twitter:image'] = data.twitter['twitter:image'] ? abs(data.twitter['twitter:image']) : '';
  return data;
}

function renderSeo(d){
  const len = s => s ? s.length : 0;
  const titleChk = !d.title ? ['err','缺少'] : (d.title.length>60 ? ['warn',d.title.length+' 字（偏長）'] : (d.title.length<10?['warn',d.title.length+' 字（偏短）']:['ok',d.title.length+' 字']));
  const descChk = !d.description ? ['err','缺少'] : (d.description.length>160 ? ['warn',d.description.length+' 字（偏長）'] : (d.description.length<50?['warn',d.description.length+' 字（偏短）']:['ok',d.description.length+' 字']));
  const ogChk = Object.keys(d.og).length ? ['ok',Object.keys(d.og).length+' 個'] : ['warn','無'];
  const twChk = Object.keys(d.twitter).length ? ['ok',Object.keys(d.twitter).length+' 個'] : ['warn','無'];
  const h1Chk = d.h1.length===1 ? ['ok','1 個'] : (d.h1.length===0?['warn','0 個']:['warn',d.h1.length+' 個']);
  const row = (k, valHtml, chk) => `<div class="seo-row"><div class="seo-key">${k}${chk?`<span class="chk ${chk[0]}">${esc(chk[1])}</span>`:''}</div><div class="seo-val">${valHtml}</div></div>`;
  const v = s => s ? esc(s) : '<span class="muted">（無）</span>';
  $('pSeo').innerHTML =
    row('標題 title', v(d.title), titleChk) +
    row('描述 description', v(d.description), descChk) +
    row('H1 標題', d.h1.length?esc(d.h1.join(' · ')):'<span class="muted">（無）</span>', h1Chk) +
    row('Canonical', d.canonical?`<span class="mono">${esc(d.canonical)}</span>`:'<span class="muted">（無）</span>') +
    row('Robots', v(d.robots)) +
    row('語言 lang', v(d.lang)) +
    row('Viewport', `<span class="mono">${v(d.viewport)}</span>`) +
    row('Charset', `<span class="mono">${v(d.charset)}</span>`) +
    row('Theme color', d.themeColor?`<span class="mono">${esc(d.themeColor)}</span>`:'<span class="muted">（無）</span>') +
    row('Keywords', v(d.keywords)) +
    row('Favicon', d.favicon?`<span class="mono">${esc(d.favicon)}</span>`:'<span class="muted">（無）</span>') +
    row('Open Graph', '<span class="seo-val mono" style="color:var(--text3)">og:* 標籤</span>', ogChk) +
    row('Twitter Card', '<span class="seo-val mono" style="color:var(--text3)">twitter:* 標籤</span>', twChk);
  $('bSeo').textContent = Object.keys(d.props).length + (d.title?1:0);
}

function imgHtml(src, cls){
  if(!src) return `<div class="img ${cls} noimg">無 og:image</div>`;
  return `<img class="img ${cls}" src="${esc(src)}" alt="" onerror="this.outerHTML='<div class=\\'img ${cls} noimg\\'>圖片無法載入</div>'">`;
}
function renderSocial(d){
  const url = normUrl($('urlInput').value);
  const domain = url ? url.hostname.replace(/^www\./,'') : (d.og['og:url']||'').replace(/^https?:\/\//,'').replace(/^www\./,'').split('/')[0] || 'example.com';
  const title = d.twitter['twitter:title'] || d.og['og:title'] || d.title || '（無標題）';
  const desc  = d.twitter['twitter:description'] || d.og['og:description'] || d.description || '';
  const img   = d.twitter['twitter:image'] || d.og['og:image'] || '';
  const siteName = d.og['og:site_name'] || domain;
  const cardType = (d.twitter['twitter:card'] || 'summary_large_image');

  const twitter = `<div class="prev-col"><h3>𝕏 / Twitter（${esc(cardType)}）</h3>
    <div class="card-x">
      ${cardType==='summary' ? '' : imgHtml(img,'')}
      <div class="body">
        <div class="dom">${esc(domain)}</div>
        <div class="title">${esc(title)}</div>
        ${desc?`<div class="desc">${esc(desc)}</div>`:''}
      </div>
    </div></div>`;

  const fb = `<div class="prev-col"><h3>Facebook / Open Graph</h3>
    <div class="card-fb">
      ${imgHtml(img,'')}
      <div class="body">
        <div class="dom">${esc(domain)}</div>
        <div class="title">${esc(title)}</div>
        ${desc?`<div class="desc">${esc(desc)}</div>`:''}
      </div>
    </div>
    <div style="font-size:11px;color:var(--text3);margin-top:8px;font-family:var(--mono)">og:site_name · ${esc(siteName)}</div>
    </div>`;

  $('pSocial').innerHTML = `<div class="prev-grid">${twitter}${fb}</div>`;
}

function renderRaw(d){
  const entries = [];
  if(d.title) entries.push(['title', d.title]);
  Object.keys(d.props).sort((a,b)=>{
    const rank = k => k.startsWith('og:')?0 : k.startsWith('twitter:')?1 : 2;
    return rank(a)-rank(b) || a.localeCompare(b);
  }).forEach(k => entries.push([k, d.props[k]]));
  if(!entries.length){ $('pRaw').innerHTML = `<div class="empty"><div class="empty-icon">{ }</div><p>沒有找到 meta 標籤</p></div>`; return; }
  $('pRaw').innerHTML = `<div class="raw-list">${entries.map(([k,v]) =>
    `<div class="raw-item"><div class="raw-key">${esc(k)}</div><div class="raw-val">${esc(v)}</div></div>`).join('')}</div>`;
  $('bRaw').textContent = entries.length;
}

function doParse(html){
  if(!html.trim()){ setStatus('請先貼上 HTML 原始碼', 'err'); return; }
  try {
    parsedData = parseHtml(html);
    renderSeo(parsedData);
    renderSocial(parsedData);
    renderRaw(parsedData);
    showTab('seo');
    const ogN = Object.keys(parsedData.og).length, twN = Object.keys(parsedData.twitter).length;
    setStatus(`✓ 解析完成 · ${Object.keys(parsedData.props).length} 個 meta · OG ${ogN} · Twitter ${twN}`, 'ok');
  } catch(e){
    setStatus('✗ 解析失敗：'+(e.message||''), 'err');
  }
}

// ── try direct fetch (often blocked by CORS) ──
async function tryFetch(){
  const url = normUrl($('urlInput').value);
  if(!url){ setStatus('請先輸入有效網址', 'err'); return; }
  setStatus('嘗試抓取 '+url.href+' …');
  try {
    const r = await fetch(url.href, { mode:'cors' });
    const html = await r.text();
    $('htmlInput').value = html;
    setStatus('✓ 抓取成功，已填入 HTML，正在解析…', 'ok');
    doParse(html);
  } catch(e){
    setStatus('✗ 無法直接抓取（多半因 CORS 限制）。請手動「檢視原始碼」複製貼上後解析。', 'err');
  }
}

// ── events ──
$('btnDns').addEventListener('click', runDns);
$('btnParse').addEventListener('click', () => doParse($('htmlInput').value));
$('btnFetch').addEventListener('click', tryFetch);
$('urlInput').addEventListener('keydown', e => { if(e.key==='Enter') runDns(); });
$('btnClear').addEventListener('click', () => {
  $('urlInput').value=''; $('htmlInput').value=''; parsedData=null;
  ['bDns','bSeo','bRaw'].forEach(id=>$(id).textContent='0');
  $('pDns').innerHTML = `<div class="empty"><div class="empty-icon">🔍</div><p>輸入網域後點「查 DNS」</p></div>`;
  $('pSeo').innerHTML = `<div class="empty"><div class="empty-icon">🏷</div><p>貼上 HTML 原始碼後點「解析 HTML」</p></div>`;
  $('pSocial').innerHTML = `<div class="empty"><div class="empty-icon">📣</div><p>解析 HTML 後在此預覽分享卡片</p></div>`;
  $('pRaw').innerHTML = `<div class="empty"><div class="empty-icon">{ }</div><p>解析 HTML 後在此列出所有標籤</p></div>`;
  showTab('dns'); setStatus('已清除');
});
