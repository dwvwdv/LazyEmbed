<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>計數器小工具範例</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg:     #0d0f12;
            --bg2:    #13161b;
            --bg3:    #1a1e25;
            --bg4:    #222730;
            --border: #2a2f3a;
            --border2:#333a47;
            --text:   #cdd5e0;
            --text2:  #7e8a9e;
            --accent: #3b82f6;
            --mono:   'JetBrains Mono', monospace;
            --sans:   'IBM Plex Sans', system-ui, sans-serif;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: var(--sans);
            background: var(--bg);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .counter-widget {
            background: var(--bg2);
            border: 1px solid var(--border);
            padding: 3rem;
            border-radius: 14px;
            text-align: center;
            min-width: 320px;
        }

        .counter-title {
            font-family: var(--mono);
            font-size: 10px;
            font-weight: 600;
            letter-spacing: .12em;
            text-transform: uppercase;
            color: var(--accent);
            margin-bottom: 2rem;
        }

        .counter-display {
            font-family: var(--mono);
            font-size: 5rem;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 2rem;
            font-variant-numeric: tabular-nums;
            padding: 1.5rem;
            background: var(--bg3);
            border: 1px solid var(--border);
            border-radius: 10px;
            letter-spacing: .04em;
        }

        .counter-buttons {
            display: flex;
            gap: 1rem;
            justify-content: center;
            margin-bottom: 1rem;
        }

        .counter-btn {
            padding: 0.875rem 1.5rem;
            font-size: 1.5rem;
            font-weight: 600;
            border: 1px solid var(--border);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.18s ease;
            background: var(--bg3);
            color: var(--text);
            font-family: var(--sans);
        }

        .counter-btn:hover {
            background: var(--bg4);
            border-color: var(--border2);
            transform: translateY(-1px);
        }

        .counter-btn:active {
            transform: translateY(1px);
            opacity: .8;
        }

        .btn-increment {
            background: rgba(34,197,94,.12);
            color: #4ade80;
            border-color: rgba(34,197,94,.3);
            min-width: 80px;
        }

        .btn-increment:hover {
            background: rgba(34,197,94,.22);
        }

        .btn-decrement {
            background: rgba(239,68,68,.12);
            color: #f87171;
            border-color: rgba(239,68,68,.3);
            min-width: 80px;
        }

        .btn-decrement:hover {
            background: rgba(239,68,68,.22);
        }

        .btn-reset {
            width: 100%;
            background: rgba(59,130,246,.12);
            color: #60a5fa;
            border-color: rgba(59,130,246,.3);
            font-size: 1rem;
            font-weight: 500;
            padding: 0.75rem;
        }

        .btn-reset:hover {
            background: rgba(59,130,246,.22);
        }
    </style>
</head>
<body>
    <div class="counter-widget">
        <div class="counter-title">互動式計數器</div>
        <div class="counter-display" id="counter">0</div>
        <div class="counter-buttons">
            <button class="counter-btn btn-decrement" onclick="decrement()">−</button>
            <button class="counter-btn btn-increment" onclick="increment()">+</button>
        </div>
        <button class="counter-btn btn-reset" onclick="reset()">重置</button>
    </div>

    <script>
        let count = 0;

        function updateDisplay() {
            document.getElementById('counter').textContent = count;
        }

        function increment() {
            count++;
            updateDisplay();
        }

        function decrement() {
            count--;
            updateDisplay();
        }

        function reset() {
            count = 0;
            updateDisplay();
        }
    </script>
</body>
</html>
