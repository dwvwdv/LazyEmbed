<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>資金流可視化</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.js"></script>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
  /* Offbeat — lazyrhythm 設計系統 tokens v1（Nord × Brutalism），工具介面 STRUCTURE 6 / MOTION 3。
     與 LazyEmbed 其他頁面共用同一組值；每個文字色在 bg／bg2／bg3 三層上都 ≥ 4.5:1。
     Nord 原色負責「被看見」（填色、邊框、圓點），*-ink 負責「被讀懂」（文字）。 */
  --bg:          #2e3440; /* polar0：頁面底 */
  --bg2:         #3b4252; /* polar1：卡片、面板、輸入框 */
  --bg3:         #434c5e; /* polar2：標題欄、hover、選中 */
  --bg4:         #434c5e; /* polar2：chip 與狀態區塊底 */
  --inset:       #272c36; /* 內凹的槽：程式碼區塊、進度條軌道 */
  --border:      #4c566a; /* polar3：裝飾性結構邊框 */
  --border2:     #838ea6; /* 控制項外框：≥ 3:1 */
  --text-strong: #eceff4;
  --text:        #d8dee9;
  --text2:       #b8bdc8; /* dim-ink：輔助文字 */
  --text3:       #b8bdc8;
  --accent:      #88c0d0; /* frost1：主按鈕底、邊條、focus */
  --accent2:     #8fbcbb; /* frost0：主按鈕 hover */
  --accent-text: #93c6d4; /* frost-ink：強調文字與連結 */
  --accent-ink:  #2e3440; /* 疊在 accent 上的字：6.24:1 */
  --accent-bg:   #434c5e; /* 選中狀態底：sunken，不用半透明藍 */
  --shadow-offset: #5e81ac;
  --success:     #a3be8c;
  --ok:          #a3be8c;
  --ok-ink:      #b0cb98;
  --ok-bg:       #434c5e;
  --warning:     #ebcb8b;
  --warn:        #ebcb8b;
  --warn-ink:    #ebcb8b;
  --warn-bg:     #434c5e;
  --caution:     #d08770;
  --caution-ink: #f3ae95;
  --danger:      #bf616a;
  --err:         #bf616a;
  --err-ink:     #f4abb2;
  --err-bg:      #434c5e;
  --danger-fill: #a54049;
  --danger-fill-hover: #8f3a42;
  --special:     #b48ead;
  --special-ink: #d9b2d3;
  --key-c:       #93c6d4;
  --str-c:       #b0cb98;
  --num-c:       #d9b2d3;
  --bool-c:      #f3ae95;
  --null-c:      #b8bdc8;
  --hl-bg:       #434c5e;
  --hl-active:   #4c566a;
  --hl-border:   #88c0d0;
  --mono:        'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Noto Sans Mono CJK TC', monospace;
  --sans:        system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans TC', 'PingFang TC', 'Hiragino Sans TC', 'Microsoft JhengHei', sans-serif;
  --radius:      0;
  --radius-sm:   0;
  --offset:      3px;
  --shadow:      3px 3px 0 0 #5e81ac;
  --shadow-lg:   4px 4px 0 0 #5e81ac;
  --shadow-ghost: 3px 3px 0 0 #4c566a;
  --scrim:       rgba(0,0,0,.55);
  color-scheme: dark;
        }

        body {
            font-family: var(--sans);
            background: var(--bg);
            color: var(--text);
            padding: 20px;
            min-height: 100vh;
            font-size: 14px;
            line-height: 1.6;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
        }

        .header {
            padding: 28px 24px;
            text-align: center;
            border-bottom: 1px solid var(--border);
        }

        .header h1 {
            font-size: 22px;
            margin-bottom: 6px;
            color: var(--text);
            font-weight: 600;
        }

        .header p {
            color: var(--text2);
            font-size: 13px;
        }

        .content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            padding: 20px;
        }

        .chart-section {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .chart-container {
            width: 100%;
            max-width: 500px;
            height: 500px;
            position: relative;
        }

        .data-section {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .form-section {
            background: var(--bg3);
            border: 1px solid var(--border);
            padding: 20px;
            border-radius: var(--radius);
        }

        .form-section h2 {
            font-size: 0.9375rem;
            font-weight: 600;
            margin-bottom: 14px;
            color: var(--text);
        }

        .form-rows {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 14px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 100px 1fr 120px 40px;
            gap: 8px;
            align-items: center;
        }

        .form-row select,
        .form-row input {
            padding: 8px 12px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 13px;
            background: var(--bg);
            color: var(--text);
            transition: border-color 0.18s ease;
            font-family: var(--sans);
        }

        .form-row select:focus,
        .form-row input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 2px var(--accent);
        }

        .form-row select:hover,
        .form-row input:hover {
            border-color: var(--border2);
        }

        .btn-remove {
            width: 32px;
            height: 32px;
            background: #434c5e;
            color: #f4abb2;
            border: 1px solid #bf616a;
            border-radius: 50%;
            cursor: pointer;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.18s ease;
        }

        .btn-remove:hover {
            background: #434c5e;
            border-color: #bf616a;
            transform: scale(1.08);
        }

        .btn-remove:active {
            transform: scale(0.93);
        }

        .btn-add {
            padding: 10px 20px;
            background: var(--bg4);
            color: var(--accent-text);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.18s ease;
            font-family: var(--sans);
        }

        .btn-add:hover {
            background: var(--bg3);
            border-color: var(--border2);
            transform: translateY(-1px);
        }

        .btn-add:active {
            transform: translateY(1px);
        }

        .btn-generate {
            padding: 11px 24px;
            background: var(--accent);
            color: var(--accent-ink);
            border: 2px solid var(--accent2);
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            width: 100%;
            margin-top: 10px;
            transition: all 0.18s ease;
            font-family: var(--sans);
    box-shadow: var(--shadow);
}

        .btn-generate:hover {
            background: #8fbcbb;
            transform: translateY(-1px);
        }

        .btn-generate:active {
            transform: translateY(1px);
        }

        .summary-section {
            background: var(--bg3);
            border: 1px solid var(--border);
            padding: 20px;
            border-radius: var(--radius);
        }

        .summary-section h2 {
            font-size: 0.9375rem;
            font-weight: 600;
            margin-bottom: 14px;
            color: var(--text);
        }

        .data-list {
            background: var(--bg);
            border: 1px solid var(--border);
            padding: 14px;
            border-radius: var(--radius-sm);
            margin-bottom: 14px;
            font-family: var(--mono);
            font-size: 12px;
            line-height: 1.65;
            max-height: 200px;
            overflow-y: auto;
        }

        .data-list-item {
            padding: 3px 0;
            color: var(--text2);
        }

        .calculations {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .calc-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 14px;
            background: var(--bg4);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            transition: border-color 0.18s ease;
        }

        .calc-item:hover {
            border-color: var(--border2);
        }

        .calc-item.income .calc-value {
            color: #b0cb98;
        }

        .calc-item.expense .calc-value {
            color: #f4abb2;
        }

        .calc-item.remaining {
            font-weight: 600;
            border-color: var(--border2);
        }

        .calc-item.remaining .calc-value {
            color: #ebcb8b;
        }

        .calc-label {
            color: var(--text2);
            font-size: 13px;
        }

        .calc-value {
            font-size: 16px;
            font-weight: 600;
            color: var(--text);
            font-family: var(--mono);
        }

        /* 平板 */
        @media (max-width: 1024px) {
            .content {
                grid-template-columns: 1fr;
            }

            .chart-container {
                max-width: 400px;
                height: 400px;
            }
        }

        /* 小平板 */
        @media (max-width: 768px) {
            body {
                padding: 12px;
            }

            .header h1 {
                font-size: 24px;
            }

            .header p {
                font-size: 13px;
            }

            .content {
                gap: 16px;
                padding: 16px;
            }

            .chart-container {
                max-width: 100%;
                height: 350px;
            }

            .form-section h2,
            .summary-section h2 {
                font-size: 16px;
                margin-bottom: 12px;
            }

            .form-row {
                grid-template-columns: 80px 1fr 100px 36px;
                gap: 6px;
            }

            .form-row select,
            .form-row input {
                padding: 6px 10px;
                font-size: 13px;
            }

            .btn-remove {
                width: 30px;
                height: 30px;
                font-size: 16px;
            }

            .data-list {
                font-size: 12px;
                max-height: 150px;
            }

            .calc-value {
                font-size: 16px;
            }
        }

        /* 手機橫屏 */
        @media (max-width: 640px) {
            .header {
                padding: 16px;
            }

            .header h1 {
                font-size: 20px;
            }

            .content {
                padding: 12px;
                gap: 12px;
            }

            .chart-container {
                height: 300px;
            }

            .form-section,
            .summary-section {
                padding: 16px;
            }
        }

        /* 手機直屏 */
        @media (max-width: 480px) {
            body {
                padding: 8px;
            }

            .header {
                padding: 12px;
            }

            .header h1 {
                font-size: 18px;
                margin-bottom: 4px;
            }

            .header p {
                font-size: 12px;
            }

            .content {
                padding: 8px;
                gap: 8px;
            }

            .chart-container {
                height: 280px;
            }

            .form-section,
            .summary-section {
                padding: 12px;
                border-radius: 0;
            }

            .form-section h2,
            .summary-section h2 {
                font-size: 15px;
                margin-bottom: 10px;
            }

            .form-row {
                grid-template-columns: 70px 1fr 80px 32px;
                gap: 4px;
            }

            .form-row select,
            .form-row input {
                padding: 6px 8px;
                font-size: 12px;
            }

            .btn-remove {
                width: 28px;
                height: 28px;
                font-size: 14px;
            }

            .btn-add {
                padding: 8px 16px;
                font-size: 13px;
            }

            .btn-generate {
                padding: 10px 20px;
                font-size: 14px;
            }

            .data-list {
                padding: 12px;
                font-size: 11px;
                max-height: 120px;
            }

            .calc-item {
                padding: 10px;
            }

            .calc-label {
                font-size: 12px;
            }

            .calc-value {
                font-size: 14px;
            }
        }

        /* 超小手機 */
        @media (max-width: 360px) {
            .header h1 {
                font-size: 16px;
            }

            .chart-container {
                height: 240px;
            }

            .form-row {
                grid-template-columns: 1fr;
                gap: 6px;
            }

            .form-row select,
            .form-row input,
            .btn-remove {
                width: 100%;
            }

            .btn-remove {
                height: 32px;
                max-width: 100px;
                margin: 0 auto;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>資金流可視化</h1>
            <p>清楚了解您的收支狀況</p>
        </div>

        <div class="content">
            <!-- 左側：圖表 -->
            <div class="chart-section">
                <div class="chart-container">
                    <canvas id="cashflowChart"></canvas>
                </div>
            </div>

            <!-- 右側：表單與摘要 -->
            <div class="data-section">
                <!-- 輸入表單 -->
                <div class="form-section">
                    <h2>資料輸入</h2>
                    <div class="form-rows" id="formRows">
                        <!-- 動態生成的表單列 -->
                    </div>
                    <button class="btn-add" onclick="addRow()">+ 新增項目</button>
                    <button class="btn-generate" onclick="generateChart()">生成圖表</button>
                    <button class="btn-generate" onclick="copyEmbedUrl()" style="margin-top: 8px; background: var(--bg2); color: var(--text); border-color: var(--border2); box-shadow: var(--shadow-ghost);">複製嵌入連結</button>
                </div>

                <!-- 資料列表與計算結果 -->
                <div class="summary-section">
                    <h2>資料摘要</h2>
                    <div class="data-list" id="dataList">
                        <div style="color: #b8bdc8; text-align: center;">請輸入資料並生成圖表</div>
                    </div>
                    <div class="calculations" id="calculations">
                        <!-- 計算結果 -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let chart = null;
        let rowCounter = 0;

        // 初始化：新增預設行或從 URL 參數載入
        function init() {
            const urlParams = new URLSearchParams(window.location.search);
            const dataParam = urlParams.get('data');

            if (dataParam) {
                // 從 URL 參數載入資料
                loadFromUrlParam(dataParam);
            } else {
                // 新增預設的空白行
                for (let i = 0; i < 3; i++) {
                    addRow();
                }
            }
        }

        // 從 URL 參數載入資料
        function loadFromUrlParam(dataParam) {
            const rows = dataParam.split('|');
            rows.forEach(row => {
                const [type, name, amount] = row.split(',');
                addRow(type, name, amount);
            });
            // 自動生成圖表
            setTimeout(() => generateChart(), 100);
        }

        // 新增表單列
        function addRow(type = '收入', name = '', amount = '') {
            rowCounter++;
            const rowId = `row-${rowCounter}`;
            const formRows = document.getElementById('formRows');

            const rowDiv = document.createElement('div');
            rowDiv.className = 'form-row';
            rowDiv.id = rowId;
            rowDiv.innerHTML = `
                <select class="row-type">
                    <option value="收入" ${type === '收入' ? 'selected' : ''}>收入</option>
                    <option value="費用" ${type === '費用' ? 'selected' : ''}>費用</option>
                </select>
                <input type="text" class="row-name" placeholder="項目名稱" value="${name}">
                <input type="number" class="row-amount" placeholder="金額" value="${amount}" min="0">
                <button class="btn-remove" onclick="removeRow('${rowId}')">×</button>
            `;

            formRows.appendChild(rowDiv);
        }

        // 刪除表單列
        function removeRow(rowId) {
            const row = document.getElementById(rowId);
            if (row) {
                row.remove();
            }
        }

        // 收集表單資料
        function collectData() {
            const rows = document.querySelectorAll('.form-row');
            const data = {
                income: [],
                expense: []
            };

            rows.forEach(row => {
                const type = row.querySelector('.row-type').value;
                const name = row.querySelector('.row-name').value.trim();
                const amount = parseFloat(row.querySelector('.row-amount').value) || 0;

                if (name && amount > 0) {
                    const item = { name, amount };
                    if (type === '收入') {
                        data.income.push(item);
                    } else {
                        data.expense.push(item);
                    }
                }
            });

            return data;
        }

        // 生成圖表
        function generateChart() {
            const data = collectData();

            // 計算總額
            const totalIncome = data.income.reduce((sum, item) => sum + item.amount, 0);
            const totalExpense = data.expense.reduce((sum, item) => sum + item.amount, 0);
            const remaining = totalIncome - totalExpense;

            if (totalIncome === 0) {
                alert('請至少輸入一筆收入資料');
                return;
            }

            // 更新資料列表
            updateDataList(data);

            // 更新計算結果
            updateCalculations(totalIncome, totalExpense, remaining);

            // 繪製圖表
            drawChart(data, totalIncome, totalExpense, remaining);
        }

        // 更新資料列表
        function updateDataList(data) {
            const dataList = document.getElementById('dataList');
            let html = '';

            data.income.forEach(item => {
                html += `<div class="data-list-item">收入,${item.name},${item.amount}</div>`;
            });

            data.expense.forEach(item => {
                html += `<div class="data-list-item">費用,${item.name},${item.amount}</div>`;
            });

            dataList.innerHTML = html || '<div style="color: #b8bdc8;">無資料</div>';
        }

        // 更新計算結果
        function updateCalculations(totalIncome, totalExpense, remaining) {
            const calculations = document.getElementById('calculations');
            calculations.innerHTML = `
                <div class="calc-item income">
                    <span class="calc-label">總收入</span>
                    <span class="calc-value">$${totalIncome.toLocaleString()}</span>
                </div>
                <div class="calc-item expense">
                    <span class="calc-label">總費用</span>
                    <span class="calc-value">$${totalExpense.toLocaleString()}</span>
                </div>
                <div class="calc-item remaining">
                    <span class="calc-label">剩餘可分配金額</span>
                    <span class="calc-value">$${remaining.toLocaleString()}</span>
                </div>
            `;
        }

        // 繪製圖表
        function drawChart(data, totalIncome, totalExpense, remaining) {
            const ctx = document.getElementById('cashflowChart');

            // 銷毀舊圖表
            if (chart) {
                chart.destroy();
            }

            // 費用細項顏色（Offbeat：Aurora 暖色系）
            const expenseColors = [
                '#bf616a',
                '#d08770',
                '#b48ead',
                '#a54049',
                '#8f3a42'
            ];

            // 收入細項顏色（Offbeat：Aurora green ＋ Frost）
            const incomeColors = [
                '#a3be8c',
                '#8fbcbb',
                '#88c0d0',
                '#81a1c1',
                '#5e81ac'
            ];

            // 準備內圈資料（費用細項 + 剩餘可支配金額）
            const innerData = [];
            const innerLabels = [];
            const innerColors = [];

            // 加入費用細項（每個都是相對於收入總額的百分比）
            data.expense.forEach((item, index) => {
                const percentage = (item.amount / totalIncome * 100).toFixed(1);
                innerData.push(item.amount);
                innerLabels.push(`${item.name} ${percentage}%`);
                innerColors.push(expenseColors[index % expenseColors.length]);
            });

            // 加入剩餘可支配金額
            if (remaining > 0) {
                innerData.push(remaining);
                innerLabels.push(`剩餘 ${(remaining / totalIncome * 100).toFixed(1)}%`);
                innerColors.push('#ebcb8b');
            }

            // 準備外圈資料（收入細項）
            const outerData = [];
            const outerLabels = [];
            const outerColors = [];

            // 加入收入細項（每個都是相對於收入總額的百分比）
            data.income.forEach((item, index) => {
                const percentage = (item.amount / totalIncome * 100).toFixed(1);
                outerData.push(item.amount);
                outerLabels.push(`${item.name} ${percentage}%`);
                outerColors.push(incomeColors[index % incomeColors.length]);
            });

            // 創建圖表
            chart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    datasets: [
                        {
                            label: '外圈 - 收入來源',
                            data: outerData,
                            backgroundColor: outerColors,
                            borderWidth: 2,
                            borderColor: '#3b4252'
                        },
                        {
                            label: '內圈 - 支出分配',
                            data: innerData,
                            backgroundColor: innerColors,
                            borderWidth: 2,
                            borderColor: '#3b4252'
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    plugins: {
                        legend: {
                            position: 'bottom',
                            labels: {
                                padding: 15,
                                font: {
                                    size: 12
                                },
                                generateLabels: function(chart) {
                                    const datasets = chart.data.datasets;
                                    const labels = [];

                                    // 外圈標籤（收入，綠色）
                                    datasets[0].data.forEach((value, i) => {
                                        labels.push({
                                            text: outerLabels[i],
                                            fillStyle: outerColors[i],
                                            fontColor: '#d8dee9',
                                            hidden: false,
                                            index: i,
                                            datasetIndex: 0
                                        });
                                    });

                                    // 內圈標籤（費用+剩餘，紅色+橘色）
                                    datasets[1].data.forEach((value, i) => {
                                        labels.push({
                                            text: innerLabels[i],
                                            fillStyle: innerColors[i],
                                            fontColor: '#d8dee9',
                                            hidden: false,
                                            index: i,
                                            datasetIndex: 1
                                        });
                                    });

                                    return labels;
                                }
                            }
                        },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    const datasetIndex = context.datasetIndex;
                                    const index = context.dataIndex;
                                    const value = context.parsed || 0;

                                    // 根據 dataset 索引選擇正確的標籤
                                    const label = datasetIndex === 0
                                        ? outerLabels[index]
                                        : innerLabels[index];

                                    return `${label}: $${value.toLocaleString()}`;
                                }
                            }
                        }
                    }
                }
            });
        }

        // 生成並複製嵌入 URL
        function copyEmbedUrl() {
            const data = collectData();

            if (data.income.length === 0 && data.expense.length === 0) {
                alert('請先輸入資料');
                return;
            }

            // 生成 URL 參數
            const params = [];
            data.income.forEach(item => {
                params.push(`收入,${item.name},${item.amount}`);
            });
            data.expense.forEach(item => {
                params.push(`費用,${item.name},${item.amount}`);
            });

            const dataParam = params.join('|');
            const baseUrl = window.location.origin + window.location.pathname;
            const embedUrl = `${baseUrl}?data=${encodeURIComponent(dataParam)}`;

            // 複製到剪貼簿
            navigator.clipboard.writeText(embedUrl).then(() => {
                alert('嵌入連結已複製！\n\n' + embedUrl);
            }).catch(err => {
                // 如果複製失敗，顯示 URL 讓用戶手動複製
                prompt('請手動複製以下連結：', embedUrl);
            });
        }

        // 頁面載入時初始化
        init();
    </script>
</body>
</html>
