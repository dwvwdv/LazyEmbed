<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON Table Visualizer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg:        #0d0f12;
            --bg2:       #13161b;
            --bg3:       #1a1e25;
            --bg4:       #222730;
            --border:    #2a2f3a;
            --border2:   #333a47;
            --text:      #cdd5e0;
            --text2:     #7e8a9e;
            --text3:     #4a5568;
            --accent:    #3b82f6;
            --accent-bg: rgba(59,130,246,.10);
            --success:   #22c55e;
            --danger:    #ef4444;
            --warning:   #f59e0b;
            --mono:      'JetBrains Mono', 'Courier New', monospace;
            --sans:      'IBM Plex Sans', system-ui, sans-serif;
            --radius:    10px;
            --radius-sm: 6px;
        }

        body {
            font-family: var(--sans);
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
            padding: 2rem;
            font-size: 14px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .header h1 {
            font-size: 1.875rem;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 0.5rem;
        }

        .header p {
            color: var(--text2);
            font-size: 0.9375rem;
        }

        /* Main Layout */
        .main-layout {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        /* Input Section */
        .input-section {
            background: var(--bg2);
            border: 1px solid var(--border);
            padding: 1.5rem;
            border-radius: var(--radius);
        }

        .section-title {
            font-size: 0.9375rem;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 1rem;
        }

        .json-input {
            width: 100%;
            min-height: 400px;
            padding: 1rem;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            background: var(--bg);
            color: var(--text);
            font-family: var(--mono);
            font-size: 0.8125rem;
            resize: vertical;
            transition: border-color 0.18s ease;
            line-height: 1.65;
        }

        .json-input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-bg);
        }

        /* Buttons */
        .button-group {
            display: flex;
            gap: 0.75rem;
            margin-top: 1rem;
        }

        .btn {
            padding: 0.5rem 1.125rem;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 0.9375rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.18s ease;
            background: var(--bg3);
            color: var(--text);
            font-family: var(--sans);
        }

        .btn:hover {
            transform: translateY(-1px);
            background: var(--bg4);
            border-color: var(--border2);
        }

        .btn:active {
            transform: translateY(1px);
            opacity: .8;
        }

        .btn-primary {
            background: var(--accent);
            color: white;
            border-color: transparent;
        }

        .btn-primary:hover {
            background: #2563eb;
            border-color: transparent;
        }

        .btn-success {
            background: rgba(34,197,94,.15);
            color: #4ade80;
            border-color: rgba(34,197,94,.3);
        }

        .btn-success:hover {
            background: rgba(34,197,94,.25);
        }

        .btn-secondary {
            background: var(--bg3);
            color: var(--text2);
            border-color: var(--border);
        }

        .btn-secondary:hover {
            color: var(--text);
            border-color: var(--border2);
        }

        /* Table Section */
        .table-section {
            background: var(--bg2);
            border: 1px solid var(--border);
            padding: 1.5rem;
            border-radius: var(--radius);
        }

        /* Breadcrumb Navigation */
        .breadcrumb {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 1rem;
            padding: 0.5rem 0.875rem;
            background: var(--bg3);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            flex-wrap: wrap;
        }

        .breadcrumb-item {
            color: var(--text2);
            font-size: 0.875rem;
            cursor: pointer;
            transition: color 0.18s ease;
        }

        .breadcrumb-item:hover {
            color: var(--accent);
        }

        .breadcrumb-item.active {
            color: var(--accent);
            font-weight: 600;
        }

        .breadcrumb-separator {
            color: var(--text3);
        }

        /* Table Container */
        .table-container {
            overflow-x: auto;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: var(--bg2);
        }

        thead {
            background: var(--bg3);
            border-bottom: 1px solid var(--border2);
        }

        th {
            padding: 0.875rem 1rem;
            text-align: left;
            font-weight: 600;
            font-size: 0.8125rem;
            color: var(--text2);
            position: sticky;
            top: 0;
            z-index: 10;
            background: var(--bg3);
            font-family: var(--mono);
            letter-spacing: .04em;
            text-transform: uppercase;
        }

        th:first-child { border-top-left-radius: var(--radius-sm); }
        th:last-child  { border-top-right-radius: var(--radius-sm); }

        tbody tr {
            border-bottom: 1px solid var(--border);
            transition: background 0.15s ease;
        }

        tbody tr:last-child { border-bottom: none; }

        tbody tr:hover {
            background: var(--bg3);
        }

        td {
            padding: 0.75rem 1rem;
            font-size: 0.875rem;
            color: var(--text);
        }

        /* Object Cell - Special styling for nested objects */
        .object-cell {
            cursor: pointer;
            position: relative;
            padding: 0.375rem 0.875rem;
            background: rgba(245,158,11,.12);
            color: #fbbf24;
            border: 1px solid rgba(245,158,11,.3);
            border-radius: var(--radius-sm);
            display: inline-block;
            min-width: 120px;
            text-align: center;
            transition: all 0.18s ease;
            font-size: 0.8125rem;
        }

        .object-cell:hover {
            background: rgba(245,158,11,.22);
            border-color: rgba(245,158,11,.5);
            transform: translateY(-1px);
        }

        .object-cell:active {
            transform: translateY(1px);
        }

        .object-cell::after {
            content: ' 🔍';
            margin-left: 0.375rem;
        }

        .array-cell {
            background: rgba(139,92,246,.12);
            color: #a78bfa;
            border-color: rgba(139,92,246,.3);
        }

        .array-cell:hover {
            background: rgba(139,92,246,.22);
            border-color: rgba(139,92,246,.5);
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 3rem;
            color: var(--text2);
        }

        .empty-state svg {
            width: 80px;
            height: 80px;
            margin-bottom: 1rem;
            opacity: 0.3;
        }

        /* Error Message */
        .error-message {
            background: rgba(239,68,68,.1);
            color: #f87171;
            border: 1px solid rgba(239,68,68,.3);
            padding: 0.875rem 1rem;
            border-radius: var(--radius-sm);
            margin-top: 1rem;
            font-size: 0.875rem;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        /* Sample Data */
        .sample-data {
            margin-top: 0.75rem;
        }

        .sample-btn {
            font-size: 0.8125rem;
            padding: 0.4375rem 0.875rem;
        }

        /* Responsive Design */
        @media (max-width: 1024px) {
            .main-layout {
                grid-template-columns: 1fr;
            }

            .header h1 {
                font-size: 1.5rem;
            }
        }

        @media (max-width: 768px) {
            body {
                padding: 1rem;
            }

            .input-section,
            .table-section {
                padding: 1.25rem;
            }

            .header h1 {
                font-size: 1.375rem;
            }

            .button-group {
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }
        }

        @media (max-width: 480px) {
            .header h1 {
                font-size: 1.5rem;
            }

            th, td {
                padding: 0.5rem;
                font-size: 0.85rem;
            }
        }

        /* Loading Indicator */
        .loading {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid var(--border2);
            border-radius: 50%;
            border-top-color: var(--accent);
            animation: spin 0.8s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Cell Type Indicators */
        .cell-type {
            display: inline-block;
            padding: 0.125rem 0.4rem;
            border-radius: 4px;
            font-size: 0.6875rem;
            font-weight: 600;
            margin-left: 0.375rem;
            font-family: var(--mono);
            opacity: 0.85;
        }

        .type-string  { background: rgba(59,130,246,.12);  color: #60a5fa; }
        .type-number  { background: rgba(34,197,94,.12);   color: #4ade80; }
        .type-boolean { background: rgba(251,146,60,.12);  color: #fb923c; }
        .type-null    { background: var(--bg4);            color: var(--text3); }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>JSON Table Visualizer</h1>
            <p>將 JSON 資料轉換為可視化表格，支援嵌套物件瀏覽</p>
        </div>

        <!-- Main Content -->
        <div class="main-layout">
            <!-- Input Section -->
            <div class="input-section">
                <h2 class="section-title">JSON 輸入</h2>
                <textarea
                    id="jsonInput"
                    class="json-input"
                    placeholder='輸入 JSON 資料，例如：
[
  {
    "name": "John",
    "age": 30,
    "address": {
      "city": "Taipei",
      "zip": "100"
    }
  }
]'></textarea>
                <div class="error-message" id="errorMessage"></div>
                <div class="button-group">
                    <button class="btn btn-primary" onclick="parseJSON()">
                        解析 JSON
                    </button>
                    <button class="btn btn-secondary" onclick="clearData()">
                        清除
                    </button>
                </div>
                <div class="sample-data">
                    <button class="btn btn-success sample-btn" onclick="loadSampleData()">
                        載入範例資料
                    </button>
                </div>
            </div>

            <!-- Table Section -->
            <div class="table-section">
                <h2 class="section-title">資料表格</h2>

                <!-- Breadcrumb Navigation -->
                <div class="breadcrumb" id="breadcrumb">
                    <span class="breadcrumb-item active" onclick="navigateToRoot()">根目錄</span>
                </div>

                <!-- Table Container -->
                <div class="table-container">
                    <div class="empty-state" id="emptyState">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17V7m0 10a2 2 0 01-2 2H5a2 2 0 01-2-2V7a2 2 0 012-2h2a2 2 0 012 2m0 10a2 2 0 002 2h2a2 2 0 002-2M9 7a2 2 0 012-2h2a2 2 0 012 2m0 10V7m0 10a2 2 0 002 2h2a2 2 0 002-2V7a2 2 0 00-2-2h-2a2 2 0 00-2 2" />
                        </svg>
                        <p>尚無資料，請輸入 JSON 並點擊「解析 JSON」</p>
                    </div>
                    <div id="tableContent"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Global state
        let currentData = null;
        let navigationStack = [];
        let selectedCell = null;

        // Parse JSON input
        function parseJSON() {
            const input = document.getElementById('jsonInput').value.trim();
            const errorMessage = document.getElementById('errorMessage');

            if (!input) {
                showError('請輸入 JSON 資料');
                return;
            }

            try {
                const data = JSON.parse(input);
                currentData = data;
                navigationStack = [{ data: data, label: '根目錄' }];
                errorMessage.classList.remove('show');
                renderTable(data);
                hideEmptyState();
            } catch (error) {
                showError('JSON 格式錯誤: ' + error.message);
            }
        }

        // Render table from data
        function renderTable(data) {
            const tableContent = document.getElementById('tableContent');

            // Handle different data types
            if (Array.isArray(data)) {
                if (data.length === 0) {
                    showEmptyState();
                    return;
                }
                tableContent.innerHTML = createTableFromArray(data);
            } else if (typeof data === 'object' && data !== null) {
                tableContent.innerHTML = createTableFromObject(data);
            } else {
                showError('資料必須是陣列或物件');
                return;
            }

            // Add keyboard event listener
            addKeyboardListener();
        }

        // Create table from array
        function createTableFromArray(arr) {
            // Get all unique keys from array objects
            const keys = new Set();
            arr.forEach(item => {
                if (typeof item === 'object' && item !== null) {
                    Object.keys(item).forEach(key => keys.add(key));
                }
            });

            if (keys.size === 0) {
                return '<p class="empty-state">無法從陣列建立表格</p>';
            }

            const keysArray = Array.from(keys);

            let html = '<table><thead><tr>';
            keysArray.forEach(key => {
                html += `<th>${escapeHtml(key)}</th>`;
            });
            html += '</tr></thead><tbody>';

            arr.forEach((item, rowIndex) => {
                html += '<tr>';
                keysArray.forEach(key => {
                    const value = item[key];
                    html += `<td>${formatCellValue(value, key, rowIndex)}</td>`;
                });
                html += '</tr>';
            });

            html += '</tbody></table>';
            return html;
        }

        // Create table from object
        function createTableFromObject(obj) {
            let html = '<table><thead><tr><th>鍵</th><th>值</th></tr></thead><tbody>';

            Object.entries(obj).forEach(([key, value], index) => {
                html += '<tr>';
                html += `<td><strong>${escapeHtml(key)}</strong></td>`;
                html += `<td>${formatCellValue(value, key, index)}</td>`;
                html += '</tr>';
            });

            html += '</tbody></table>';
            return html;
        }

        // Format cell value based on type
        function formatCellValue(value, key, rowIndex) {
            if (value === null) {
                return '<span style="color: var(--text-secondary); font-style: italic;">null</span>';
            }

            if (value === undefined) {
                return '<span style="color: var(--text-secondary); font-style: italic;">undefined</span>';
            }

            const type = typeof value;

            if (type === 'object') {
                if (Array.isArray(value)) {
                    return `<span class="object-cell array-cell" onclick="navigateToObject(${rowIndex}, '${escapeHtml(key)}', true)" tabindex="0" data-row="${rowIndex}" data-key="${escapeHtml(key)}">陣列 [${value.length}]</span>`;
                } else {
                    const keyCount = Object.keys(value).length;
                    return `<span class="object-cell" onclick="navigateToObject(${rowIndex}, '${escapeHtml(key)}', false)" tabindex="0" data-row="${rowIndex}" data-key="${escapeHtml(key)}">物件 {${keyCount}}</span>`;
                }
            }

            if (type === 'boolean') {
                return `<span style="color: ${value ? 'var(--success-color)' : 'var(--danger-color)'}; font-weight: 600;">${value}</span>`;
            }

            if (type === 'number') {
                return `<span style="color: var(--success-color);">${value}</span>`;
            }

            return escapeHtml(String(value));
        }

        // Navigate to nested object
        function navigateToObject(rowIndex, key, isArray) {
            const currentLevel = navigationStack[navigationStack.length - 1];
            let data = currentLevel.data;

            // Get the nested object
            let nestedData;
            if (Array.isArray(data)) {
                nestedData = data[rowIndex][key];
            } else {
                nestedData = data[key];
            }

            if (!nestedData) return;

            // Add to navigation stack
            navigationStack.push({
                data: nestedData,
                label: key
            });

            // Update breadcrumb
            updateBreadcrumb();

            // Render new table
            renderTable(nestedData);
        }

        // Navigate to specific level in stack
        function navigateToLevel(level) {
            if (level < 0 || level >= navigationStack.length) return;

            // Remove items after this level
            navigationStack = navigationStack.slice(0, level + 1);

            // Update breadcrumb
            updateBreadcrumb();

            // Render table
            const currentLevel = navigationStack[navigationStack.length - 1];
            renderTable(currentLevel.data);
        }

        // Navigate to root
        function navigateToRoot() {
            navigateToLevel(0);
        }

        // Update breadcrumb navigation
        function updateBreadcrumb() {
            const breadcrumb = document.getElementById('breadcrumb');
            let html = '';

            navigationStack.forEach((item, index) => {
                const isLast = index === navigationStack.length - 1;
                const className = isLast ? 'breadcrumb-item active' : 'breadcrumb-item';
                html += `<span class="${className}" onclick="navigateToLevel(${index})">${escapeHtml(item.label)}</span>`;

                if (!isLast) {
                    html += '<span class="breadcrumb-separator">→</span>';
                }
            });

            breadcrumb.innerHTML = html;
        }

        // Keyboard navigation
        function addKeyboardListener() {
            // Remove existing listener
            document.removeEventListener('keydown', handleKeyPress);
            // Add new listener
            document.addEventListener('keydown', handleKeyPress);
        }

        function handleKeyPress(e) {
            // Get all object cells
            const objectCells = document.querySelectorAll('.object-cell');
            if (objectCells.length === 0) return;

            // Handle Enter key on focused element
            if (e.key === 'Enter') {
                const focused = document.activeElement;
                if (focused && focused.classList.contains('object-cell')) {
                    focused.click();
                }
            }

            // Handle Backspace to go back
            if (e.key === 'Backspace' && navigationStack.length > 1) {
                e.preventDefault();
                navigateToLevel(navigationStack.length - 2);
            }

            // Handle arrow keys for navigation between cells
            if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) {
                const focused = document.activeElement;
                const index = Array.from(objectCells).indexOf(focused);

                if (index !== -1) {
                    e.preventDefault();
                    let newIndex = index;

                    if (e.key === 'ArrowDown' || e.key === 'ArrowRight') {
                        newIndex = (index + 1) % objectCells.length;
                    } else if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') {
                        newIndex = (index - 1 + objectCells.length) % objectCells.length;
                    }

                    objectCells[newIndex].focus();
                }
            }
        }

        // Show/hide empty state
        function showEmptyState() {
            document.getElementById('emptyState').style.display = 'block';
            document.getElementById('tableContent').innerHTML = '';
        }

        function hideEmptyState() {
            document.getElementById('emptyState').style.display = 'none';
        }

        // Show error message
        function showError(message) {
            const errorMessage = document.getElementById('errorMessage');
            errorMessage.textContent = message;
            errorMessage.classList.add('show');
            showEmptyState();
        }

        // Clear data
        function clearData() {
            document.getElementById('jsonInput').value = '';
            document.getElementById('errorMessage').classList.remove('show');
            currentData = null;
            navigationStack = [];
            showEmptyState();
            document.getElementById('breadcrumb').innerHTML = '<span class="breadcrumb-item active">根目錄</span>';
        }

        // Load sample data
        function loadSampleData() {
            const sampleData = [
                {
                    "id": 1,
                    "name": "張三",
                    "age": 28,
                    "active": true,
                    "department": {
                        "name": "技術部",
                        "location": "台北",
                        "manager": {
                            "name": "李經理",
                            "email": "manager@example.com"
                        }
                    },
                    "skills": ["JavaScript", "Python", "React"],
                    "salary": 50000
                },
                {
                    "id": 2,
                    "name": "李四",
                    "age": 32,
                    "active": false,
                    "department": {
                        "name": "業務部",
                        "location": "台中",
                        "manager": {
                            "name": "王經理",
                            "email": "wmanager@example.com"
                        }
                    },
                    "skills": ["Sales", "Marketing"],
                    "salary": 45000
                },
                {
                    "id": 3,
                    "name": "王五",
                    "age": 25,
                    "active": true,
                    "department": {
                        "name": "設計部",
                        "location": "高雄",
                        "manager": {
                            "name": "陳經理",
                            "email": "cmanager@example.com"
                        }
                    },
                    "skills": ["Photoshop", "Illustrator", "Figma"],
                    "salary": 48000
                }
            ];

            document.getElementById('jsonInput').value = JSON.stringify(sampleData, null, 2);
        }

        // Escape HTML to prevent XSS
        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return String(text).replace(/[&<>"']/g, m => map[m]);
        }

        // Initialize
        window.addEventListener('DOMContentLoaded', () => {
            showEmptyState();
        });
    </script>
</body>
</html>
