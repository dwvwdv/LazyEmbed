<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>密碼與金鑰產生器 — Secure Password & Key Generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:#0d0f12; --bg2:#13161b; --bg3:#1a1e25; --bg4:#222730;
    --border:#2a2f3a; --border2:#333a47;
    --text:#cdd5e0; --text2:#7e8a9e; --text3:#4a5568;
    --accent:#22c55e; --accent-bg:rgba(34,197,94,.10);
    --warn:#f59e0b; --err:#f87171; --ok:#22c55e;
    --radius:8px; --radius-sm:5px;
    --mono:'JetBrains Mono','Fira Code',monospace;
    --sans:'IBM Plex Sans',system-ui,sans-serif;
  }

  html, body { min-height:100%; background:var(--bg); color:var(--text); font-family:var(--sans); font-size:14px; line-height:1.5; }

  /* ── Header ── */
  .header { display:flex; align-items:center; gap:12px; padding:0 16px; height:48px; border-bottom:1px solid var(--border); background:var(--bg2); position:sticky; top:0; z-index:10; }
  .back-btn { display:flex; align-items:center; gap:6px; font-size:12px; color:var(--text2); text-decoration:none; padding:5px 10px; border:1px solid var(--border); border-radius:var(--radius-sm); transition:all .15s; }
  .back-btn:hover { border-color:var(--accent); color:var(--accent); }
  .sep { color:var(--text3); font-size:11px; }
  .logo { display:flex; align-items:center; gap:8px; font-family:var(--mono); font-size:13px; font-weight:600; }
  .logo-icon { width:22px; height:22px; background:var(--accent); border-radius:5px; display:flex; align-items:center; justify-content:center; font-size:12px; color:#05210f; flex-shrink:0; }
  .spacer { flex:1; }
  .header-meta { font-family:var(--mono); font-size:11px; color:var(--text3); }

  /* ── Container ── */
  .wrap { max-width:680px; margin:0 auto; padding:28px 20px 60px; }
  .sec-title { font-size:11px; font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:var(--text3); margin:30px 0 14px; display:flex; align-items:center; gap:10px; }
  .sec-title::after { content:''; flex:1; height:1px; background:var(--border); }
  .sec-title:first-of-type { margin-top:0; }

  /* ── Password display ── */
  .pw-display { background:var(--bg2); border:1px solid var(--border); border-radius:var(--radius); padding:22px; }
  .pw-value { font-family:var(--mono); font-size:22px; font-weight:500; line-height:1.5; word-break:break-all; color:var(--text); min-height:33px; letter-spacing:.01em; }
  .pw-value .c-up{color:#93c5fd;} .pw-value .c-lo{color:var(--text);} .pw-value .c-di{color:#4ade80;} .pw-value .c-sy{color:#fb923c;}
  .pw-actions { display:flex; gap:8px; margin-top:16px; }
  .pw-actions button { flex:1; display:flex; align-items:center; justify-content:center; gap:7px; font-family:var(--sans); font-size:13px; font-weight:500; padding:9px; border-radius:var(--radius-sm); cursor:pointer; transition:all .15s; border:1px solid var(--border2); }
  .btn-primary { background:var(--accent); border-color:var(--accent) !important; color:#05210f; }
  .btn-primary:hover { filter:brightness(1.08); }
  .btn-ghost { background:transparent; color:var(--text2); }
  .btn-ghost:hover { border-color:var(--accent); color:var(--accent); }

  /* ── Strength meter ── */
  .strength { margin-top:18px; }
  .str-bar { height:5px; background:var(--bg4); border-radius:3px; overflow:hidden; }
  .str-fill { height:100%; width:0; border-radius:3px; transition:width .25s, background .25s; }
  .str-meta { display:flex; justify-content:space-between; margin-top:7px; font-family:var(--mono); font-size:11px; color:var(--text3); }
  .str-label { font-weight:600; }

  /* ── Controls ── */
  .panel { background:var(--bg2); border:1px solid var(--border); border-radius:var(--radius); padding:18px 20px; }
  .ctrl-row { display:flex; align-items:center; gap:12px; padding:11px 0; border-bottom:1px solid var(--border); }
  .ctrl-row:last-child { border-bottom:none; }
  .ctrl-row.col { flex-direction:column; align-items:stretch; gap:10px; }
  .ctrl-label { font-size:13px; color:var(--text); flex-shrink:0; }
  .ctrl-label .sub { display:block; font-size:11px; color:var(--text3); margin-top:1px; }
  .len-display { font-family:var(--mono); font-size:20px; font-weight:600; color:var(--accent); min-width:42px; text-align:right; }
  input[type=range] { -webkit-appearance:none; appearance:none; flex:1; height:5px; background:var(--bg4); border-radius:3px; outline:none; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:17px; height:17px; border-radius:50%; background:var(--accent); cursor:pointer; border:3px solid var(--bg2); box-shadow:0 0 0 1px var(--accent); }
  input[type=range]::-moz-range-thumb { width:14px; height:14px; border-radius:50%; background:var(--accent); cursor:pointer; border:3px solid var(--bg2); }

  .chk-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .chk { display:flex; align-items:center; gap:9px; padding:9px 12px; background:var(--bg3); border:1px solid var(--border); border-radius:var(--radius-sm); cursor:pointer; transition:all .15s; user-select:none; }
  .chk:hover { border-color:var(--border2); }
  .chk.on { border-color:var(--accent); background:var(--accent-bg); }
  .chk input { accent-color:var(--accent); width:15px; height:15px; cursor:pointer; }
  .chk .lbl { font-size:13px; }
  .chk .eg { font-family:var(--mono); font-size:10.5px; color:var(--text3); margin-left:auto; }

  .seg { display:flex; gap:6px; }
  .seg button { flex:1; font-family:var(--mono); font-size:12px; padding:6px 0; background:var(--bg3); border:1px solid var(--border); border-radius:var(--radius-sm); color:var(--text2); cursor:pointer; transition:all .15s; }
  .seg button:hover { border-color:var(--border2); }
  .seg button.on { border-color:var(--accent); color:var(--accent); background:var(--accent-bg); }

  /* ── Batch list ── */
  .batch { margin-top:14px; display:none; flex-direction:column; gap:6px; }
  .batch.show { display:flex; }
  .batch-item { display:flex; align-items:center; gap:10px; padding:8px 12px; background:var(--bg2); border:1px solid var(--border); border-radius:var(--radius-sm); }
  .batch-item code { font-family:var(--mono); font-size:13px; flex:1; word-break:break-all; color:var(--text); }
  .mini-copy { font-size:11px; color:var(--text3); background:none; border:1px solid var(--border); border-radius:4px; padding:3px 9px; cursor:pointer; transition:all .15s; flex-shrink:0; }
  .mini-copy:hover { border-color:var(--accent); color:var(--accent); }

  /* ── Keys ── */
  .key-grid { display:flex; flex-direction:column; gap:10px; }
  .key-card { background:var(--bg2); border:1px solid var(--border); border-radius:var(--radius); padding:14px 16px; }
  .key-head { display:flex; align-items:center; gap:10px; margin-bottom:9px; }
  .key-name { font-size:13px; font-weight:600; color:var(--text); }
  .key-desc { font-size:11px; color:var(--text3); }
  .key-bytes { margin-left:auto; display:flex; gap:4px; }
  .key-bytes button { font-family:var(--mono); font-size:10.5px; padding:3px 8px; background:var(--bg3); border:1px solid var(--border); border-radius:4px; color:var(--text3); cursor:pointer; transition:all .15s; }
  .key-bytes button.on { border-color:var(--accent); color:var(--accent); background:var(--accent-bg); }
  .key-value-row { display:flex; align-items:center; gap:10px; }
  .key-value { flex:1; font-family:var(--mono); font-size:13px; color:var(--accent); word-break:break-all; background:var(--bg); border:1px solid var(--border); border-radius:var(--radius-sm); padding:9px 12px; min-height:36px; }
  .key-btns { display:flex; gap:6px; flex-shrink:0; }
  .icon-btn { width:34px; height:34px; display:flex; align-items:center; justify-content:center; background:var(--bg3); border:1px solid var(--border2); border-radius:var(--radius-sm); color:var(--text2); cursor:pointer; transition:all .15s; font-size:14px; }
  .icon-btn:hover { border-color:var(--accent); color:var(--accent); }

  .tip { margin-top:14px; font-size:12px; color:var(--text3); line-height:1.7; padding:12px 14px; background:var(--bg2); border:1px solid var(--border); border-left:2px solid var(--accent); border-radius:var(--radius-sm); }
  .tip code { font-family:var(--mono); color:var(--text2); background:var(--bg4); padding:1px 5px; border-radius:3px; }
  .footer { text-align:center; font-family:var(--mono); font-size:11px; color:var(--text3); padding:24px 16px; border-top:1px solid var(--border); }

  @media (max-width:520px){ .chk-grid{grid-template-columns:1fr;} .pw-value{font-size:18px;} }
</style>
</head>
<body>

<header class="header">
  <a class="back-btn" href="../index.html">&#8592; 返回</a>
  <span class="sep">/</span>
  <div class="logo"><div class="logo-icon">🔑</div> 密碼與金鑰產生器</div>
  <div class="spacer"></div>
  <span class="header-meta">crypto.getRandomValues</span>
</header>

<div class="wrap">

  <div class="sec-title">隨機密碼</div>

  <div class="pw-display">
    <div class="pw-value" id="pwValue"></div>
    <div class="pw-actions">
      <button class="btn-primary" id="btnRegen">↻ 重新產生</button>
      <button class="btn-ghost" id="btnCopyPw">複製密碼</button>
    </div>
    <div class="strength">
      <div class="str-bar"><div class="str-fill" id="strFill"></div></div>
      <div class="str-meta">
        <span class="str-label" id="strLabel">—</span>
        <span id="strBits">—</span>
      </div>
    </div>
  </div>

  <div class="batch" id="batch"></div>

  <div class="panel" style="margin-top:16px">
    <div class="ctrl-row">
      <div class="ctrl-label">長度</div>
      <input type="range" id="lenRange" min="4" max="128" value="20">
      <div class="len-display" id="lenVal">20</div>
    </div>
    <div class="ctrl-row col">
      <div class="ctrl-label">字元類型</div>
      <div class="chk-grid">
        <label class="chk on" data-set="upper"><input type="checkbox" checked><span class="lbl">大寫</span><span class="eg">A-Z</span></label>
        <label class="chk on" data-set="lower"><input type="checkbox" checked><span class="lbl">小寫</span><span class="eg">a-z</span></label>
        <label class="chk on" data-set="digit"><input type="checkbox" checked><span class="lbl">數字</span><span class="eg">0-9</span></label>
        <label class="chk on" data-set="symbol"><input type="checkbox" checked><span class="lbl">符號</span><span class="eg">!@#$…</span></label>
      </div>
    </div>
    <div class="ctrl-row col">
      <div class="ctrl-label">選項</div>
      <div class="chk-grid">
        <label class="chk on" data-opt="exclude"><input type="checkbox" checked><span class="lbl">排除易混淆字元</span><span class="eg">0Oo1Il</span></label>
        <label class="chk on" data-opt="each"><input type="checkbox" checked><span class="lbl">每類至少一個</span></label>
      </div>
    </div>
    <div class="ctrl-row">
      <div class="ctrl-label">數量</div>
      <div class="seg" id="qtySeg" style="flex:1">
        <button class="on" data-qty="1">1</button>
        <button data-qty="3">3</button>
        <button data-qty="5">5</button>
        <button data-qty="10">10</button>
      </div>
    </div>
  </div>

  <div class="sec-title">金鑰快速產生</div>
  <div class="key-grid" id="keyGrid"></div>

  <div class="tip">
    💡 設定 Supabase 環境變數時，<code>JWT_SECRET</code> 建議使用 32 bytes 以上的 Base64 或 Hex 金鑰；
    服務間識別碼可用 <code>UUID v4</code>。所有數值皆由瀏覽器的 <code>crypto.getRandomValues</code> 產生，不經任何伺服器。
  </div>

</div>

<footer class="footer">所有金鑰於瀏覽器本地產生 · 不傳輸、不記錄</footer>

<script>
const $ = id => document.getElementById(id);

// ── Secure RNG ────────────────────────────────────────────
function randUint32(){ const b=new Uint32Array(1); crypto.getRandomValues(b); return b[0]; }
function randIndex(max){ // unbiased integer in [0, max)
  if(max<=0) return 0;
  const limit = Math.floor(0x100000000 / max) * max;
  let x; do { x = randUint32(); } while(x >= limit);
  return x % max;
}
function randBytes(n){ const b=new Uint8Array(n); crypto.getRandomValues(b); return b; }
function shuffle(arr){ for(let i=arr.length-1;i>0;i--){ const j=randIndex(i+1); [arr[i],arr[j]]=[arr[j],arr[i]]; } return arr; }

function toHex(bytes){ return Array.from(bytes, b=>b.toString(16).padStart(2,'0')).join(''); }
function toB64(bytes){ let s=''; bytes.forEach(b=>s+=String.fromCharCode(b)); return btoa(s); }
function toB64url(bytes){ return toB64(bytes).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }
function uuidv4(){
  if(crypto.randomUUID) return crypto.randomUUID();
  const b=randBytes(16); b[6]=(b[6]&0x0f)|0x40; b[8]=(b[8]&0x3f)|0x80;
  const h=toHex(b); return `${h.slice(0,8)}-${h.slice(8,12)}-${h.slice(12,16)}-${h.slice(16,20)}-${h.slice(20)}`;
}

// ── Password ──────────────────────────────────────────────
const SETS = {
  upper:'ABCDEFGHIJKLMNOPQRSTUVWXYZ',
  lower:'abcdefghijklmnopqrstuvwxyz',
  digit:'0123456789',
  symbol:'!@#$%^&*()-_=+[]{};:,.?/'
};
const AMBIG = new Set('O0oIl1B8S5Z2G6q9');

const opts = {
  length:20, qty:1,
  sets:{ upper:true, lower:true, digit:true, symbol:true },
  exclude:true, each:true
};

function buildPools(){
  const pools={};
  for(const k in SETS){
    if(!opts.sets[k]) continue;
    let chars = SETS[k].split('');
    if(opts.exclude) chars = chars.filter(c => !AMBIG.has(c));
    if(chars.length) pools[k]=chars;
  }
  return pools;
}

function genPassword(){
  const pools = buildPools();
  const keys = Object.keys(pools);
  if(!keys.length) return '';
  const all = keys.flatMap(k=>pools[k]);
  const chars=[];
  if(opts.each){
    keys.forEach(k => { chars.push(pools[k][randIndex(pools[k].length)]); });
  }
  while(chars.length < opts.length) chars.push(all[randIndex(all.length)]);
  if(chars.length > opts.length) chars.length = opts.length;
  return shuffle(chars).join('');
}

function poolSize(){ const p=buildPools(); return Object.values(p).reduce((s,a)=>s+a.length,0); }

function colorize(pw){
  return [...pw].map(c => {
    let cls='c-lo';
    if(/[A-Z]/.test(c)) cls='c-up';
    else if(/[0-9]/.test(c)) cls='c-di';
    else if(!/[a-z]/.test(c)) cls='c-sy';
    return `<span class="${cls}">${c.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}</span>`;
  }).join('');
}

function strength(pw){
  const size = poolSize();
  const bits = size>1 ? Math.round(pw.length * Math.log2(size)) : 0;
  let label, color, pct;
  if(bits<40){ label='弱'; color='var(--err)'; }
  else if(bits<60){ label='普通'; color='var(--warn)'; }
  else if(bits<90){ label='強'; color='var(--accent)'; }
  else if(bits<128){ label='很強'; color='var(--ok)'; }
  else { label='極強'; color='var(--ok)'; }
  pct = Math.min(100, Math.round(bits/128*100));
  return { bits, label, color, pct };
}

let current='';
function render(){
  const pwList = Array.from({length:opts.qty}, genPassword);
  current = pwList[0] || '';
  $('pwValue').innerHTML = current ? colorize(current) : '<span style="color:var(--err);font-size:14px">請至少選擇一種字元類型</span>';
  const s = strength(current);
  $('strFill').style.width = s.pct+'%';
  $('strFill').style.background = s.color;
  $('strLabel').textContent = current ? '強度：'+s.label : '—';
  $('strLabel').style.color = current ? s.color : 'var(--text3)';
  $('strBits').textContent = current ? `~${s.bits} bits · 字元集 ${poolSize()}` : '—';

  const batch=$('batch');
  if(opts.qty>1 && current){
    batch.classList.add('show');
    batch.innerHTML = pwList.map(p => `<div class="batch-item"><code>${colorize(p)}</code><button class="mini-copy" data-pw="${p.replace(/"/g,'&quot;')}">複製</button></div>`).join('');
    batch.querySelectorAll('.mini-copy').forEach(b => b.addEventListener('click', () => copyText(b.dataset.pw, b)));
  } else {
    batch.classList.remove('show'); batch.innerHTML='';
  }
}

function copyText(text, btn){
  navigator.clipboard.writeText(text).then(() => {
    const o=btn.textContent; btn.textContent='已複製 ✓'; setTimeout(()=>btn.textContent=o,1200);
  });
}

// ── Events: password ──────────────────────────────────────
$('lenRange').addEventListener('input', e => { opts.length=+e.target.value; $('lenVal').textContent=opts.length; render(); });
$('btnRegen').addEventListener('click', render);
$('btnCopyPw').addEventListener('click', () => { if(current) copyText(current, $('btnCopyPw')); });

document.querySelectorAll('[data-set]').forEach(el => {
  el.addEventListener('change', () => {
    opts.sets[el.dataset.set] = el.querySelector('input').checked;
    el.classList.toggle('on', el.querySelector('input').checked);
    render();
  });
});
document.querySelectorAll('[data-opt]').forEach(el => {
  el.addEventListener('change', () => {
    opts[el.dataset.opt] = el.querySelector('input').checked;
    el.classList.toggle('on', el.querySelector('input').checked);
    render();
  });
});
$('qtySeg').querySelectorAll('button').forEach(b => {
  b.addEventListener('click', () => {
    $('qtySeg').querySelectorAll('button').forEach(x=>x.classList.remove('on'));
    b.classList.add('on'); opts.qty=+b.dataset.qty; render();
  });
});

// ── Keys ──────────────────────────────────────────────────
const KEYS = [
  { id:'uuid',  name:'UUID v4',     desc:'通用唯一識別碼', bytes:null, gen:()=>uuidv4() },
  { id:'hex',   name:'Hex 字串',    desc:'十六進位隨機字串', bytes:[16,32,64], def:32, gen:n=>toHex(randBytes(n)) },
  { id:'b64',   name:'Base64 金鑰', desc:'適合 JWT / API Secret', bytes:[24,32,48], def:32, gen:n=>toB64(randBytes(n)) },
  { id:'b64url',name:'Base64URL',   desc:'URL 安全（無 +/=）', bytes:[24,32,48], def:32, gen:n=>toB64url(randBytes(n)) },
];
const keyState = {};
function renderKeys(){
  $('keyGrid').innerHTML = KEYS.map(k => {
    const bytesUi = k.bytes ? `<div class="key-bytes" data-key="${k.id}">${k.bytes.map(b=>`<button data-b="${b}" class="${keyState[k.id]===b?'on':''}">${b}B</button>`).join('')}</div>` : '';
    return `<div class="key-card">
      <div class="key-head">
        <span class="key-name">${k.name}</span>
        <span class="key-desc">${k.desc}</span>
        ${bytesUi}
      </div>
      <div class="key-value-row">
        <div class="key-value" id="kv_${k.id}"></div>
        <div class="key-btns">
          <button class="icon-btn" data-regen="${k.id}" title="重新產生">↻</button>
          <button class="icon-btn" data-copy="${k.id}" title="複製">⧉</button>
        </div>
      </div>
    </div>`;
  }).join('');

  $('keyGrid').querySelectorAll('[data-regen]').forEach(b => b.addEventListener('click', () => genKey(b.dataset.regen)));
  $('keyGrid').querySelectorAll('[data-copy]').forEach(b => b.addEventListener('click', () => {
    const v = $('kv_'+b.dataset.copy).textContent;
    if(!v) return;
    navigator.clipboard.writeText(v).then(() => { b.textContent='✓'; setTimeout(()=>b.textContent='⧉',1000); });
  }));
  $('keyGrid').querySelectorAll('.key-bytes button').forEach(b => b.addEventListener('click', () => {
    const kid = b.parentElement.dataset.key; keyState[kid]=+b.dataset.b; renderKeys();
  }));
  KEYS.forEach(k => genKey(k.id));
}
function genKey(id){
  const k = KEYS.find(x=>x.id===id);
  const el = $('kv_'+id); if(!el) return;
  el.textContent = k.bytes ? k.gen(keyState[id]) : k.gen();
}
KEYS.forEach(k => { if(k.bytes) keyState[k.id]=k.def; });

// ── Init ──────────────────────────────────────────────────
render();
renderKeys();
</script>
</body>
</html>
