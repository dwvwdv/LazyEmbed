<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>天氣小工具範例</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
  /* Offbeat — lazyrhythm 設計系統 tokens v1（Nord × Brutalism），工具介面 STRUCTURE 6 / MOTION 3。
     與 LazyEmbed 其他頁面共用同一組值；每個文字色在 bg／bg2／bg3 三層上都 ≥ 4.5:1。
     Nord 原色負責「被看見」（填色、邊框、圓點），*-ink 負責「被讀懂」（文字）。 */
  --bg:          #2e3440; /* polar0：頁面底 */
  --bg2:         #3b4252; /* polar1：卡片、面板、輸入框 */
  --bg3:         #434c5e; /* polar2：標題欄、hover、選中 */
  --bg4:         #434c5e; /* polar2：chip 與狀態區塊底 */
  --inset:       #272c36; /* 內凹的槽：程式碼區塊、進度條軌道 */
  --border:      #4c566a; /* polar3：裝飾性結構邊框 */
  --border2:     #919bb1; /* 控制項外框：bg／bg2／bg3 三層都 ≥ 3:1 */
  --text-strong: #eceff4;
  --text:        #d8dee9;
  --text2:       #b8bdc8; /* dim-ink：輔助文字 */
  --text3:       #b8bdc8;
  --accent:      #88c0d0; /* frost1：主按鈕底、邊條、focus */
  --accent2:     #8fbcbb; /* frost0：主按鈕 hover */
  --accent-text: #93c6d4; /* frost-ink：強調文字與連結 */
  --accent-ink:  #2e3440; /* 疊在 accent 上的字：6.24:1 */
  --accent-bg:   #434c5e; /* 選中狀態底：sunken，不用半透明藍 */
  --shadow-offset: #5e81ac;
  --success:     #a3be8c;
  --ok:          #a3be8c;
  --ok-ink:      #b0cb98;
  --ok-bg:       #434c5e;
  --warning:     #ebcb8b;
  --warn:        #ebcb8b;
  --warn-ink:    #ebcb8b;
  --warn-bg:     #434c5e;
  --caution:     #d08770;
  --caution-ink: #f3ae95;
  --danger:      #bf616a;
  --err:         #bf616a;
  --err-ink:     #f4abb2;
  --err-bg:      #434c5e;
  --danger-fill: #a54049;
  --danger-fill-hover: #8f3a42;
  --special:     #b48ead;
  --special-ink: #d9b2d3;
  --key-c:       #93c6d4;
  --str-c:       #b0cb98;
  --num-c:       #d9b2d3;
  --bool-c:      #f3ae95;
  --null-c:      #b8bdc8;
  --hl-bg:       #434c5e;
  --hl-active:   #4c566a;
  --hl-border:   #88c0d0;
  --mono:        'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Noto Sans Mono CJK TC', monospace;
  --sans:        system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans TC', 'PingFang TC', 'Hiragino Sans TC', 'Microsoft JhengHei', sans-serif;
  --radius:      0;
  --radius-sm:   0;
  --offset:      3px;
  --shadow:      3px 3px 0 0 #5e81ac;
  --shadow-lg:   4px 4px 0 0 #5e81ac;
  --shadow-ghost: 3px 3px 0 0 #4c566a;
  --scrim:       rgba(0,0,0,.55);
  color-scheme: dark;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: var(--sans);
            background: var(--bg);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .weather-widget {
            background: var(--bg2);
            border: 1px solid var(--border);
            padding: 2rem;
            border-radius: 0;
            min-width: 340px;
            max-width: 400px;
            width: 100%;
        }

        .weather-header {
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .city-name {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 0.375rem;
        }

        .date {
            color: var(--text2);
            font-size: 0.8125rem;
            font-weight: 400;
        }

        .weather-main {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.25rem;
            padding: 1.5rem;
            background: var(--bg3);
            border: 1px solid var(--border);
            border-radius: 0;
        }

        .temperature {
            font-size: 3.5rem;
            font-weight: 700;
            color: var(--accent-text);
            font-family: var(--mono);
        }

        .weather-icon {
            font-size: 3.5rem;
        }

        .weather-description {
            text-align: center;
            font-size: 0.9375rem;
            color: var(--text2);
            font-weight: 500;
            margin-top: 0.375rem;
        }

        .weather-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.75rem;
        }

        .detail-item {
            padding: 1rem;
            background: var(--bg3);
            border: 1px solid var(--border);
            border-radius: 0;
            text-align: center;
            transition: border-color 0.18s ease;
        }

        .detail-item:hover {
            border-color: var(--border2);
        }

        .detail-label {
            font-size: 0.6875rem;
            color: var(--text3);
            margin-bottom: 0.375rem;
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: .08em;
            font-family: var(--mono);
        }

        .detail-value {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--text);
        }
    </style>
</head>
<body>
    <div class="weather-widget">
        <div class="weather-header">
            <div class="city-name">台北市</div>
            <div class="date" id="date"></div>
        </div>

        <div class="weather-main">
            <div class="temperature">25°</div>
            <div>
                <div class="weather-icon">晴</div>
                <div class="weather-description">晴天</div>
            </div>
        </div>

        <div class="weather-details">
            <div class="detail-item">
                <div class="detail-label">濕度</div>
                <div class="detail-value">65%</div>
            </div>
            <div class="detail-item">
                <div class="detail-label">風速</div>
                <div class="detail-value">12 km/h</div>
            </div>
            <div class="detail-item">
                <div class="detail-label">紫外線</div>
                <div class="detail-value">中等</div>
            </div>
            <div class="detail-item">
                <div class="detail-label">能見度</div>
                <div class="detail-value">10 km</div>
            </div>
        </div>
    </div>

    <script>
        // 更新日期
        function updateDate() {
            const now = new Date();
            const options = { month: 'long', day: 'numeric', weekday: 'long' };
            document.getElementById('date').textContent = now.toLocaleDateString('zh-TW', options);
        }

        updateDate();
    </script>
</body>
</html>
