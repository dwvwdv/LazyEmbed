<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>天氣小工具範例</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg:     #0d0f12;
            --bg2:    #13161b;
            --bg3:    #1a1e25;
            --border: #2a2f3a;
            --border2:#333a47;
            --text:   #cdd5e0;
            --text2:  #7e8a9e;
            --text3:  #4a5568;
            --accent: #3b82f6;
            --mono:   'JetBrains Mono', monospace;
            --sans:   'IBM Plex Sans', system-ui, sans-serif;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: var(--sans);
            background: var(--bg);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .weather-widget {
            background: var(--bg2);
            border: 1px solid var(--border);
            padding: 2rem;
            border-radius: 14px;
            min-width: 340px;
            max-width: 400px;
            width: 100%;
        }

        .weather-header {
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .city-name {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 0.375rem;
        }

        .date {
            color: var(--text2);
            font-size: 0.8125rem;
            font-weight: 400;
        }

        .weather-main {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.25rem;
            padding: 1.5rem;
            background: var(--bg3);
            border: 1px solid var(--border);
            border-radius: 10px;
        }

        .temperature {
            font-size: 3.5rem;
            font-weight: 700;
            color: var(--accent);
            font-family: var(--mono);
        }

        .weather-icon {
            font-size: 3.5rem;
        }

        .weather-description {
            text-align: center;
            font-size: 0.9375rem;
            color: var(--text2);
            font-weight: 500;
            margin-top: 0.375rem;
        }

        .weather-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.75rem;
        }

        .detail-item {
            padding: 1rem;
            background: var(--bg3);
            border: 1px solid var(--border);
            border-radius: 8px;
            text-align: center;
            transition: border-color 0.18s ease;
        }

        .detail-item:hover {
            border-color: var(--border2);
        }

        .detail-label {
            font-size: 0.6875rem;
            color: var(--text3);
            margin-bottom: 0.375rem;
            text-transform: uppercase;
            font-weight: 600;
            letter-spacing: .08em;
            font-family: var(--mono);
        }

        .detail-value {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--text);
        }
    </style>
</head>
<body>
    <div class="weather-widget">
        <div class="weather-header">
            <div class="city-name">台北市</div>
            <div class="date" id="date"></div>
        </div>

        <div class="weather-main">
            <div class="temperature">25°</div>
            <div>
                <div class="weather-icon">☀️</div>
                <div class="weather-description">晴天</div>
            </div>
        </div>

        <div class="weather-details">
            <div class="detail-item">
                <div class="detail-label">濕度</div>
                <div class="detail-value">65%</div>
            </div>
            <div class="detail-item">
                <div class="detail-label">風速</div>
                <div class="detail-value">12 km/h</div>
            </div>
            <div class="detail-item">
                <div class="detail-label">紫外線</div>
                <div class="detail-value">中等</div>
            </div>
            <div class="detail-item">
                <div class="detail-label">能見度</div>
                <div class="detail-value">10 km</div>
            </div>
        </div>
    </div>

    <script>
        // 更新日期
        function updateDate() {
            const now = new Date();
            const options = { month: 'long', day: 'numeric', weekday: 'long' };
            document.getElementById('date').textContent = now.toLocaleDateString('zh-TW', options);
        }

        updateDate();
    </script>
</body>
</html>
